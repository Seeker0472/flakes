# Clash Verge / Mihomo profile for Willow (direct SS2022).
# Replace <WILLOW_SS_PASSWORD> before importing.
#
# This profile sends all traffic through Willow. For AI-only routing, use
# willow-merge.yaml or willow-script.js with an existing subscription, or
# replace the final MATCH rule with the OpenAI rules from the merge file.

mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
  nameserver-policy:
    "+.openai.com": [https://1.1.1.1/dns-query]
    "+.chatgpt.com": [https://1.1.1.1/dns-query]
    "+.oaistatic.com": [https://1.1.1.1/dns-query]
    "+.oaiusercontent.com": [https://1.1.1.1/dns-query]
    "+.oaistatsig.com": [https://1.1.1.1/dns-query]
    "+.intercom.io": [https://1.1.1.1/dns-query]
    "+.intercomcdn.com": [https://1.1.1.1/dns-query]
    "+.ct.sendgrid.net": [https://1.1.1.1/dns-query]
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost
    - "time.*"
    - "stun.*"

tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

proxies:
  - name: Willow
    type: ss
    server: 8.229.8.238
    port: 28443
    cipher: 2022-blake3-aes-256-gcm
    password: "<WILLOW_SS_PASSWORD>"
    udp: true

  # Optional: if Willow is unreachable from the user's network, add a
  # dedicated entry hop that you are allowed to share. Do not share your
  # private airport subscription.
  #
  #  - name: Entry
  #    type: ss
  #    server: <ENTRY_SERVER>
  #    port: <ENTRY_PORT>
  #    cipher: <ENTRY_CIPHER>
  #    password: "<ENTRY_PASSWORD>"
  #    udp: true
  #
  # Then add `dialer-proxy: Entry` under the Willow proxy.

proxy-groups:
  - name: Chain
    type: select
    proxies:
      - Willow
      - DIRECT

rules:
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - MATCH,Chain
